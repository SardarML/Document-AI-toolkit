[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-ai-toolkit"
version = "0.1.0"
description = "A modular OCR, classification, NER, RAG and agent demonstration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3", "numpy>=1.24", "fastapi>=0.110", "pydantic>=2", "httpx>=0.27"]

[project.optional-dependencies]
ocr = ["paddleocr>=3", "paddlepaddle>=3"]
ner = ["spacy>=3.7"]
rag = ["langchain-core>=0.3", "langchain-text-splitters>=0.3", "langchain-huggingface>=0.1", "langchain-openai>=0.2", "langgraph>=0.2", "sentence-transformers>=3", "rank-bm25>=0.2"]
mcp = ["fastmcp>=2"]
ui = ["gradio>=5"]
tracking = ["mlflow>=2"]
all = ["paddleocr>=3", "paddlepaddle>=3", "spacy>=3.7", "langchain-core>=0.3", "langchain-text-splitters>=0.3", "langchain-huggingface>=0.1", "langchain-openai>=0.2", "langgraph>=0.2", "sentence-transformers>=3", "rank-bm25>=0.2", "fastmcp>=2", "gradio>=5", "mlflow>=2"]
dev = ["pytest>=8"]
test = ["pytest>=8", "langgraph>=0.2", "fastmcp>=2"]

[project.scripts]
document-ai = "document_ai.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
